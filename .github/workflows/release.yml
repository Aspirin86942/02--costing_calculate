name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_label:
        description: Existing release or release candidate tag to package
        required: true
        type: string
      publish:
        description: Publish the verified package to the existing tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_label }}
  cancel-in-progress: false

jobs:
  quality:
    name: Reuse public quality gates
    uses: ./.github/workflows/ci.yml

  package:
    name: Build and verify Windows package
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_LABEL: ${{ github.event_name == 'push' && github.ref_name || inputs.release_label }}

    steps:
      - name: Wait for the requested Git tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_LABEL -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-rc\.[1-9][0-9]*)?$') {
            throw "Unsupported release label: $env:RELEASE_LABEL"
          }
          $ref = "refs/tags/$env:RELEASE_LABEL"
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_LABEL"
          foreach ($attempt in 1..7) {
            $response = Invoke-WebRequest -Uri $uri -Headers @{Authorization = "Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck
            if ($response.StatusCode -eq 200 -and ($response.Content | ConvertFrom-Json).ref -ceq $ref) {
              return
            }
            if ($response.StatusCode -ne 404 -or $attempt -eq 7) {
              throw "Cannot resolve $ref (HTTP $($response.StatusCode)). Verify that the tag exists on GitHub."
            }
            Start-Sleep -Seconds 10
          }

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.sha || format('refs/tags/{0}', inputs.release_label) }}

      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
          rustc --version --verbose

      - name: Resolve immutable release identity
        id: identity
        shell: pwsh
        run: |
          $metadata = (& cargo metadata --format-version 1 --no-deps --manifest-path rust/Cargo.toml) |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to read Cargo workspace metadata.'
          }
          $cliPackages = @($metadata.packages | Where-Object { $_.name -eq 'costing-calculate' })
          if ($cliPackages.Count -ne 1) {
            throw "Expected exactly one costing-calculate package, found $($cliPackages.Count)."
          }
          $workspaceVersion = [string]$cliPackages[0].version
          $releasePattern = "^v$([regex]::Escape($workspaceVersion))(?:-rc\.[1-9][0-9]*)?$"
          if ($env:RELEASE_LABEL -notmatch $releasePattern) {
            throw "Unsupported release label: $env:RELEASE_LABEL"
          }
          $commit = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (& git rev-parse --verify "refs/tags/$env:RELEASE_LABEL^{commit}").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $commit) {
            throw "Release tag $env:RELEASE_LABEL does not identify checked-out commit $commit."
          }
          $epoch = (& git show -s --format=%ct $commit).Trim()
          "source_commit=$commit" >> $env:GITHUB_OUTPUT
          "source_date_epoch=$epoch" >> $env:GITHUB_OUTPUT
          "package_name=costing-calculate-$env:RELEASE_LABEL-windows-x86_64" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Prepare public synthetic inputs
        run: |
          uv sync --frozen --extra dev
          uv run python tools/release/generate_smoke_inputs.py --output .pytest-tmp/release-inputs

      - name: Build deterministic Windows package
        shell: pwsh
        env:
          COSTING_GIT_COMMIT: ${{ steps.identity.outputs.source_commit }}
          SOURCE_DATE_EPOCH: ${{ steps.identity.outputs.source_date_epoch }}
        run: |
          ./tools/release/package_windows.ps1 `
            -ReleaseLabel $env:RELEASE_LABEL `
            -OutputDirectory dist `
            -SourceCommit '${{ steps.identity.outputs.source_commit }}' `
            -SourceDateEpoch ([long]'${{ steps.identity.outputs.source_date_epoch }}')

      - name: Smoke package with Rust and Python absent from child PATH
        shell: pwsh
        run: |
          $packageName = '${{ steps.identity.outputs.package_name }}'
          ./tools/release/smoke_package_windows.ps1 `
            -ArchivePath "dist/$packageName.zip" `
            -ChecksumPath "dist/$packageName.zip.sha256" `
            -GbInput '.pytest-tmp/release-inputs/gb-synthetic.xlsx' `
            -SkInput '.pytest-tmp/release-inputs/sk-synthetic.xlsx' `
            -ExpectedReleaseLabel $env:RELEASE_LABEL `
            -ExpectedCommit '${{ steps.identity.outputs.source_commit }}'

      - name: Verify existing GitHub Release assets
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: |
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_LABEL"
          $response = Invoke-WebRequest -Uri $uri -Headers @{Authorization = "Bearer $env:GH_TOKEN"} -SkipHttpErrorCheck
          if ($response.StatusCode -eq 404) { return }
          if ($response.StatusCode -ne 200) { throw "GitHub Release lookup failed (HTTP $($response.StatusCode))." }
          $release = $response.Content | ConvertFrom-Json
          if ($release.tag_name -cne $env:RELEASE_LABEL) { throw 'GitHub returned a different release tag.' }
          'exists=true' >> $env:GITHUB_OUTPUT
          if ($release.draft) {
            if ($env:REQUESTED_PUBLISH -eq 'true') { throw "Complete and publish the existing $env:RELEASE_LABEL draft." }
            Write-Host "Release $env:RELEASE_LABEL has a draft. Its publisher controls the staged assets."
            return
          }
          $packageName = '${{ steps.identity.outputs.package_name }}'
          $archives = @("$packageName.zip")
          $pgo = "$packageName-pgo.zip"
          if ($pgo -in $release.assets.name -or "$pgo.sha256" -in $release.assets.name) { $archives += $pgo }
          $download = Join-Path $env:RUNNER_TEMP 'published-windows-assets'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          foreach ($archive in $archives) {
            gh release download $env:RELEASE_LABEL --dir $download --pattern $archive --pattern "$archive.sha256"
            if ($LASTEXITCODE -ne 0) { throw "Unable to download published $archive and its checksum." }
            ./tools/release/smoke_package_windows.ps1 `
              -ArchivePath (Join-Path $download $archive) -ChecksumPath (Join-Path $download "$archive.sha256") `
              -GbInput '.pytest-tmp/release-inputs/gb-synthetic.xlsx' -SkInput '.pytest-tmp/release-inputs/sk-synthetic.xlsx' `
              -ExpectedReleaseLabel $env:RELEASE_LABEL -ExpectedCommit '${{ steps.identity.outputs.source_commit }}'
          }

      - name: Publish verified GitHub Release
        if: (github.event_name == 'push' || inputs.publish) && steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/changes/releases/$($env:RELEASE_LABEL).md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes are missing: $notes"
          }
          $packageName = '${{ steps.identity.outputs.package_name }}'
          $arguments = @(
            'release',
            'create',
            $env:RELEASE_LABEL,
            "dist/$packageName.zip",
            "dist/$packageName.zip.sha256",
            '--verify-tag',
            '--title',
            "Costing Calculate $env:RELEASE_LABEL",
            '--notes-file',
            $notes
          )
          if ($env:RELEASE_LABEL -match '-rc\.') {
            $arguments += '--prerelease'
          }
          else {
            $arguments += '--latest'
          }
          # Contract command: gh release create
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release publication failed with exit code $LASTEXITCODE."
          }
