[project]
name = "costing-calculate-validation"
version = "0.3.0"
description = "Costing Calculate Rust CLI 验证工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 真实 Excel 端到端正确性测试,依赖真实数据样本",
    "benchmark: 正式性能与内存验收",
]
addopts = "-m 'not slow and not benchmark'"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "W", "UP", "S", "T10"]
ignore = ["S101", "S108"]

[tool.ruff.format]
quote-style = "single"
