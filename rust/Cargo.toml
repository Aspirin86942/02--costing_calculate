[workspace]
members = [
    "crates/costing-cli",
    "crates/costing-core",
    "crates/costing-oracle-tests",
    "crates/costing-xlsx",
]
exclude = ["vendor/rust_xlsxwriter"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.3.0"

[workspace.dependencies]
anyhow = "1"
calamine = "=0.38.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_xlsxwriter = { path = "vendor/rust_xlsxwriter", version = "=0.102.0", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = { version = "=0.11.0", default-features = false }
tempfile = "3"
thiserror = "1"
toml = { version = "=1.1.3", default-features = false, features = ["parse", "serde", "std"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
zip = { version = "=9.4.2", default-features = false }

[profile.release]
codegen-units = 1
