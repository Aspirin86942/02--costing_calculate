[package]
name = "costing-calculate"
version.workspace = true
edition.workspace = true

[features]
default = ["low-memory", "mimalloc-alloc"]
low-memory = ["costing-xlsx/low-memory"]
mimalloc-alloc = ["dep:mimalloc"]
zlib = ["costing-xlsx/zlib"]
zmij = ["costing-xlsx/zmij"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
costing-core = { path = "../costing-core" }
costing-xlsx = { path = "../costing-xlsx" }
mimalloc = { version = "=0.1.52", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[build-dependencies]
chrono.workspace = true

[dev-dependencies]
calamine.workspace = true
rust_xlsxwriter.workspace = true
